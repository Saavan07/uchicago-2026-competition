[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utcxchangelib"
version = "0.2.0"
authors = [
    { name="Ian Magnell", email="ianmm3203@gmail.com" },
]
description = "A client library for interacting with xchange-v3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    'setuptools>=69.0',
    'protobuf>=6.31.1',
    'grpcio>=1.78.0',
    'grpcio-tools>=1.78.0',
    'flask==3.1.0',
    'flask_sse==1.0.0',
    'flask_cors==5.0.1',
    'requests==2.32.3'
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
